<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chordinate Cheat Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F6F7F9; --sheet:#FFFFFF; --ink:#15181E; --muted:#5E6573; --rule:#E1E4EA;
  --cap:#FFFFFF; --cap-edge:#C5CBD4; --cap-lip:#A9B0BB; --cap-ink:#15181E;
  --accent:#2B55C9; --zebra:#F9FAFC;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101216; --sheet:#171A20; --ink:#E6E8ED; --muted:#98A0AE; --rule:#2A2F38;
    --cap:#222731; --cap-edge:#3B424E; --cap-lip:#0B0D10; --cap-ink:#EEF0F4;
    --accent:#8EA8FF; --zebra:#1B1F26;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101216; --sheet:#171A20; --ink:#E6E8ED; --muted:#98A0AE; --rule:#2A2F38;
  --cap:#222731; --cap-edge:#3B424E; --cap-lip:#0B0D10; --cap-ink:#EEF0F4;
  --accent:#8EA8FF; --zebra:#1B1F26;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 var(--sans);padding-inline:16px;padding-block:24px 40px}
.sheet{max-width:1080px;margin:0 auto;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:28px 32px 20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:20px}
h1{margin:0;font:600 26px/1.1 var(--cond);letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.meta{margin:0;font:500 11.5px/1.4 var(--mono);color:var(--muted);letter-spacing:.02em}
.groups{columns:2 420px;column-gap:40px}
.group{break-inside:avoid;margin:0 0 22px}
h2{display:flex;align-items:baseline;gap:8px;margin:0 0 6px;font:600 13px/1.2 var(--cond);text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}
.count{font:500 10.5px var(--mono);color:var(--muted);letter-spacing:0}
table{width:100%;border-collapse:collapse}
.c-chord{width:1%}
tr{border-top:1px solid var(--rule)}
tr:nth-child(even){background:var(--zebra)}
th,td{padding:5px 6px;vertical-align:middle}
th{text-align:left;font-weight:500}
td{text-align:right;white-space:nowrap}
.combo{white-space:nowrap}
code{font:500 .9em var(--mono)}
.note{display:block;font:400 11px/1.3 var(--sans);color:var(--muted)}
.combo{display:inline-flex;align-items:center;gap:2px}
kbd{display:inline-block;min-width:1.9em;padding:1px 6px 2px;font:600 11.5px/1.45 var(--mono);text-align:center;color:var(--cap-ink);background:var(--cap);border:1px solid var(--cap-edge);border-bottom:2px solid var(--cap-lip);border-radius:4px}
.plus{font:500 10px var(--mono);color:var(--muted);padding:0 1px}
.slash{font:500 12px var(--mono);color:var(--muted);padding:0 6px}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;margin-top:6px;padding-top:10px;border-top:1px solid var(--rule);font:500 10.5px/1.4 var(--mono);color:var(--muted)}
@media (max-width:560px){
  .sheet{padding:20px 14px 16px}
  th,td{padding:5px 4px}
  kbd{font-size:10.5px;padding:1px 4px 2px}
  .slash{padding:0 3px}
}
@page{size:A4 landscape;margin:10mm 12mm}
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    color-scheme:light;
    --bg:#FFFFFF; --sheet:#FFFFFF; --ink:#000000; --muted:#555B66; --rule:#D5D9E0;
    --cap:#FFFFFF; --cap-edge:#8C939E; --cap-lip:#5E6573; --cap-ink:#000000;
    --accent:#1F46B0; --zebra:#F3F5F8;
  }
  body{padding:0;font-size:10.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet{max-width:none;border:0;border-radius:0;padding:0}
  header{margin-bottom:12pt;padding-bottom:8pt}
  h1{font-size:18pt}
  .groups{columns:2;column-gap:12mm}
  .group{margin-bottom:12pt}
  th,td{padding:3.6pt 5pt}
  kbd{font-size:8.5pt}
  .note{font-size:8pt}
}
</style>
</head>
<body>
<main class="sheet">
  <header>
    <h1><span>chordinate</span> · keymap cheat sheet</h1>
    <p class="meta">{{count}} chords · JetBrains · VS Code · Obsidian · macOS &amp; Linux</p>
  </header>
  <div class="groups">
{{sections}}
  </div>
  <footer>
    <span>Omakase default — source: src/chordinate/data/keymap.json</span>
    <span>github.com/pjover/chordinate</span>
  </footer>
</main>
</body>
</html>
