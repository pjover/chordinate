[project]
name = "chordinate"
version = "0.1.0"
description = "A single source of truth for keymaps across JetBrains, VS Code, and Obsidian."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"

[project.scripts]
chordinate = "chordinate.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chordinate"]

[dependency-groups]
dev = ["pytest>=8"]
